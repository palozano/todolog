[package]
name = "todolog"
version = "0.2.0"
edition = "2021"
description = "Track TODO-style code comments in a plain Markdown task log."
repository = "https://github.com/palozano/todolog"
license = "MIT"
keywords = ["todo", "cli", "tasks", "quickfix"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
